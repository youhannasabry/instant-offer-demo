<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Instant Offer Demo</title>
  <style>
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7fa;color:#333;margin:0;}
    .container{max-width:600px;margin:2rem auto;padding:2rem;background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.1);}
    h1{text-align:center;color:#222;margin-bottom:1rem;}
    form{display:flex;flex-direction:column;gap:1rem;}
    input{padding:0.75rem;border:1px solid #ccc;border-radius:4px;font-size:1rem;width:100%;}
    button{padding:0.75rem;background:#0070f3;color:#fff;border:none;border-radius:4px;font-size:1rem;cursor:pointer;transition:background 0.2s;}
    button:hover{background:#005bb5;}
    .result, .comps-list{margin-top:1.5rem;}
    .result p{margin:.5rem 0;font-size:1rem;}
    .comps-list ul{list-style:disc;margin:0; padding-left:1.5rem;}
    .comps-list li{margin:.25rem 0;font-size:.95rem;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Instant Offer Demo</h1>
    <form id="offer-form">
      <input type="text" id="address" placeholder="11235 S STEWART AVE, Chicago, IL 60628" required />
      <input type="number" id="sqft" placeholder="e.g. 690" required />
      <button type="submit">Get Offer</button>
    </form>
    <div id="result" class="result"></div>
    <div id="comps" class="comps-list"></div>
  </div>
  <script>
    document.getElementById('offer-form').onsubmit=async e=>{
      e.preventDefault();
      const address=document.getElementById('address').value;
      const sqft=document.getElementById('sqft').value;
      const res=await fetch('/api/offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address,sqft})});
      const data=await res.json();
      if(data.error){
        document.getElementById('result').innerHTML=`<p style="color:red">Error: ${data.error}</p>`;
        document.getElementById('comps').innerHTML='';
      } else {
        document.getElementById('result').innerHTML=
          `<p><strong>Raw Valuation:</strong> $${data.rawValuation}</p>`+
          `<p><strong>Offer:</strong> $${data.offer}</p>`+
          `<p><strong>Fee:</strong> ${data.feePct*100}%</p>`+
          `<p><strong>Margin:</strong> ${data.marginPct*100}%</p>`+
          `<p><strong>Confidence Score:</strong> ${data.confidenceScore}%</p>`;
        document.getElementById('comps').innerHTML=
          '<h3>Comps Used:</h3><ul>'+data.compsUsed.map(c=>`<li>${c.address}: $${c.sale_price} (${c.living_area} sqft) - ${c.distance.toFixed(2)} mi</li>`).join('')+'</ul>';
      }
    };
  </script>
</body>
</html>
